# ==============================================================================
# LiteLLM Proxy Model & Multi-Tier Routing Configuration
# ==============================================================================
# Key 角色与健康度说明：
# - OPENAI_API_KEY_FREE_3  : 主力健康老号 (Google 免费层 15 RPM) - Tier 1 唯一主力 (完美支持 Responses API)
# - A6_API_KEY             : A6 API LLM 中转站 (高可用无限并发) - Tier 2 独立应急保底
# ==============================================================================
# Secrets are resolved from environment variables and must not be committed.

model_list:
  # === 🟢 主力日常活跃组 (Google 原生 Key 3，完美支持 Responses API 与工具调用) ===
  # Gemini 3.7 Flash - Key 3 (Old GCP Project - 100% 健康)
  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/OPENAI_API_KEY_FREE_3
      rpm: 15

  # === 🛡️ 应急保底组 (独立模型标识，避免污染主池 Responses API) ===
  # Gemini 3.7 Flash - A6 API Relay
  - model_name: gemini-3.7-backup
    litellm_params:
      model: openai/gemini-3.7-flash
      api_base: https://api.a6api.com/v1
      api_key: os.environ/A6_API_KEY
      rpm: 60

router_settings:
  routing_strategy: "least-busy" # 负载均衡：优先选择当前空闲/负载最小的 Key 派发请求

  # 🎯 开启发流前预检（Pre-Call Checks）：在正式建立数据流前检查 Key 状态
  enable_pre_call_checks: true

  # 🎯 充沛重试预算
  num_retries: 5

  # 🎯 极速熔断触发器
  allowed_fails: 1

  # 🎯 禁闭冷却期 (秒)
  cooldown_time: 60

  fallbacks:
    - gemini-3.7-flash: ["gemini-3.7-backup"]

litellm_settings:
  # 🎯 异步审计日志与汇率落库回调 (Phase 2 Custom Logger)
  callbacks: ["app.core.logging_hook.custom_logger"]

  # 🎯 确保流式 (stream=True) 请求在结束时计算并返回 Token 与 Cost
  stream_usage: true

  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    supported_call_types: [chat_completion]
    ttl: 3600

general_settings:
  # 🎯 确保 Proxy 网关层对所有流式请求开启 Token 计数
  stream_usage: true
