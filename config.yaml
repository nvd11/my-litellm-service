# ==============================================================================
# LiteLLM Proxy Model & Multi-Tier Routing Configuration
# ==============================================================================
# Key 角色与梯队定义说明：
# - OPENAI_API_KEY_FREE_1  : 主力老号 1 (主人) - Tier 1 日常轮换
# - OPENAI_API_KEY_FREE_2  : 主力老号 2 (师母) - Tier 1 日常轮换
# - OPENAI_API_KEY_PRO_PLAN: 主力 Google AI Pro 旗舰号 - Tier 2 一级应急升舱
# - OPENAI_API_KEY_FREE_3  : 终极应急保底号 - Tier 3 终极避震保底
# ==============================================================================
# Secrets are resolved from environment variables and must not be committed.

model_list:
  # === 🟢 梯队一：主力日常轮换组 (Key 1 & Key 2 平摊 50/50 负载) ===
  # Gemini 3.7 Flash - Key 1 (Master / Jason)
  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/OPENAI_API_KEY_FREE_1
      rpm: 15

  # Gemini 3.7 Flash - Key 2 (Wife)
  - model_name: gemini-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/OPENAI_API_KEY_FREE_2
      rpm: 15

  # === 🟡 梯队二：一级应急升舱组 (Pro Plan 专属，主力 429 时触发) ===
  # Gemini 3.7 Flash Pro Plan - Key 4 (Google AI Pro)
  - model_name: gemini-3.7-pro-plan
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/OPENAI_API_KEY_PRO_PLAN
      rpm: 15

  # === 🛡️ 梯队三：终极应急保底组 (Key 3 专属，平时 0 流量) ===
  # Gemini 3.7 Flash Backup - Key 3 (Old GCP Project)
  - model_name: gemini-3.7-backup
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/OPENAI_API_KEY_FREE_3
      rpm: 15

router_settings:
  routing_strategy: "least-busy" # 负载均衡：优先选择当前空闲/负载最小的 Key 派发请求

  # 🎯 开启发流前预检（Pre-Call Checks）：在正式建立数据流前，先在 Redis 中检查 Key 的 RPM 与冷却状态，
  # 若当前 Key 已接近限额，立即在发流前切换至下一个健康 Key，从源头杜绝 Mid-Stream 中途断流！
  enable_pre_call_checks: true

  # 🎯 充沛重试预算：初始尝试失败后，最多跨 Key / 跨梯队重试 5 次（总共 6 次尝试机会），
  # 确保能 100% 完整覆盖【主力 Key 1/2 -> Pro Plan 升舱 -> Key 3 终极保底】的所有梯队。
  num_retries: 5

  # 🎯 极速熔断触发器：单个 Key 只要连续失败 1 次（如遭遇 429 限流或 5xx 错误），立即判定生病并关禁闭，
  # 绝不在同一个已报错的 Key 上浪费重试次数，0.01 秒内迅速切换到下一个健康 Key。
  allowed_fails: 1

  # 🎯 满血禁闭冷却期：故障 Key 在小黑屋中隔离 60 秒（单位：秒）。
  # 设为 60 秒正好完整错开 Google 免费层的 1 分钟 (15 RPM) 滑动窗口惩罚期，确保解禁归队时 100% 满血复活。
  cooldown_time: 60

  fallbacks:
    # 🎯 梯队级联降级链：主力组 (FREE_1 + FREE_2) -> Pro Plan 升舱 -> Key 3 终极保底
    - gemini-3.7-flash: ["gemini-3.7-pro-plan", "gemini-3.7-backup"]

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    supported_call_types: [chat_completion]
    ttl: 3600
